        <p class="hero-tagline" data-t="profile.tagline"></p>

        <div class="hero-actions" id="heroLinks"></div>

        <dl class="stat-row" id="heroStats"></dl>
      </div>

      <div class="hero-portrait">
        <div class="portrait-frame">
          <img id="avatar" alt="" width="220" height="220" loading="eager" />

        <div class="portrait-glow" aria-hidden="true"></div>

  <!-- ───────────────────────────  about  ─────────────────────────── -->
